[package]
name = "nexus-way-hive"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "HIVE — the NEXUS-WAY backbone server (identity, sync, relay, Connect). Linux server deployment."

[dependencies]
nexus-common = { path = "../../../packages/rust/nexus-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
url = "2"

[dev-dependencies]
hive-client = { path = "../../../packages/rust/hive-client" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
